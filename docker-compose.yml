version: '3.8'

services:
  # 1. Python FastAPI AI Engine Backend
  python-backend:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: shopmate-python-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./python-backend/data:/app/data

  # 2. Next.js Frontend & Storefront
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopmate-frontend
    restart: always
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PYTHON_BACKEND_URL=http://python-backend:8000
    depends_on:
      - python-backend
    volumes:
      - ./data:/app/data
