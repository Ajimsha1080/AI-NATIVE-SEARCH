services:
  # 1. PostgreSQL with pgvector for Vector Search & RLS Multi-Tenancy
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shopmate-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopmate_production}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shopmate_production}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Redis for Distributed Rate Limiting, Idempotency & Session Blacklisting
  redis:
    image: redis:7-alpine
    container_name: shopmate-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. Database Migration Runner (Alembic Upgrade Head)
  migrate:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: shopmate-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password_2026}@postgres:5432/${POSTGRES_DB:-shopmate_production}
      - APP_ENV=production
    depends_on:
      postgres:
        condition: service_healthy

  # 4. Python FastAPI AI Engine Backend
  python-backend:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: shopmate-python-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8000
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://${APP_DB_USER:-postgres}:${APP_DB_PASSWORD:-postgres_secure_password_2026}@postgres:5432/${POSTGRES_DB:-shopmate_production}
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_JWT_SECRET=${SERVICE_JWT_SECRET:-aaas_live_production_jwt_service_secret_2026_secure_key!}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data

  # 5. Background Task Worker Service
  worker:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: shopmate-worker
    restart: always
    command: ["python", "-m", "app.worker"]
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://${APP_DB_USER:-postgres}:${APP_DB_PASSWORD:-postgres_secure_password_2026}@postgres:5432/${POSTGRES_DB:-shopmate_production}
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_JWT_SECRET=${SERVICE_JWT_SECRET:-aaas_live_production_jwt_service_secret_2026_secure_key!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # 6. Next.js Frontend & Storefront
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopmate-frontend
    restart: always
    ports:
      - "80:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PYTHON_BACKEND_URL=http://python-backend:8000
      - SESSION_JWT_SECRET=${SESSION_JWT_SECRET:-aaas_live_production_jwt_session_secret_2026_secure_key!}
      - SERVICE_JWT_SECRET=${SERVICE_JWT_SECRET:-aaas_live_production_jwt_service_secret_2026_secure_key!}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-aaas_live_production_aes_256_encryption_master_key_2026!}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-sarvam}
      - LLM_MODEL=${LLM_MODEL:-sarvam-105b-conversations}
      - AUTH_COOKIE_NAME=aaas_session_token
    depends_on:
      - python-backend
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:
  redis_data:
