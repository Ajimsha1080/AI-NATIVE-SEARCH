line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "migrations",
]

[lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E402",   # Module level import not at top of file
    "E501",   # Line too long
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*" = ["ASYNC230"]
"tests/*" = ["S101", "S105", "S106"]
"migrations/*" = ["ALL"]
