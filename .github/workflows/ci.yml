name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  node-lint-build-test:
    name: Node.js Typecheck, Lint, Next.js Build & Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run ESLint (no ignoreDuringBuilds)
        run: npm run lint

      - name: Run Acceptance Security Test Suite
        run: npx tsx scripts/test-acceptance.ts
        env:
          SESSION_JWT_SECRET: super_secure_ci_test_session_secret_32bytes_long!
          SERVICE_JWT_SECRET: super_secure_ci_test_service_secret_32bytes_long!
          INTERNAL_SERVICE_SECRET: super_secure_ci_test_service_secret_32bytes_long!
          ENCRYPTION_KEY: super_secure_ci_test_encryption_key_32bytes_long!

      - name: Run Security Tests
        run: npx tsx scripts/test-security.ts

      - name: Run Integration Tests
        run: npx tsx scripts/test-integration.ts

      - name: Next.js Production Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          SESSION_JWT_SECRET: super_secure_ci_test_session_secret_32bytes_long!
          SERVICE_JWT_SECRET: super_secure_ci_test_service_secret_32bytes_long!
          ENCRYPTION_KEY: super_secure_ci_test_encryption_key_32bytes_long!

  python-backend-test:
    name: Python Backend Suite & Pytest Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'python-backend/requirements-dev.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-backend/requirements-dev.txt

      - name: Run Python Acceptance Suite
        run: python python-backend/test_acceptance.py

      - name: Run Python HTTP Endpoints Suite
        run: python python-backend/test_http_endpoints.py

      - name: Run Python Pipeline Tests
        run: python python-backend/test_pipeline.py

      - name: Run Real AI Evaluation Suite
        run: python python-backend/test_evals.py

      - name: Run Database Tests
        run: python python-backend/test_db.py

      - name: Run Massive Multi-Tenancy Tests
        run: python python-backend/test_massive_multitenancy.py

      - name: Run Pytest Test Suite
        run: pytest python-backend/
        env:
          APP_ENV: development
          INTERNAL_SERVICE_SECRET: super_secure_ci_test_service_secret_32bytes_long!
          SERVICE_JWT_SECRET: super_secure_ci_test_service_secret_32bytes_long!

