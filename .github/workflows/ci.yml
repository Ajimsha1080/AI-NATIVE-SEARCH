name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-secrets:
    name: Secret Scanning & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  frontend-quality:
    name: Node.js Lint, Typecheck & Next.js Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Next.js Production Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          SESSION_JWT_SECRET: super_secure_ci_test_session_secret_32bytes_long!
          SERVICE_JWT_SECRET: super_secure_ci_test_service_secret_32bytes_long!
          ENCRYPTION_KEY: super_secure_ci_test_encryption_key_32bytes_long!

  python-backend-quality:
    name: Python Lint, Typecheck & Pytest Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'python-backend/requirements-dev.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-backend/requirements-dev.txt

      - name: Ruff Linting
        run: ruff check python-backend/app
        continue-on-error: true

      - name: Run Pytest Test Matrix (Auth, Catalog, RAG Evals)
        working-directory: python-backend
        run: pytest -v
        env:
          APP_ENV: development
          INTERNAL_SERVICE_SECRET: super_secure_ci_test_service_secret_32bytes_long!
          SERVICE_JWT_SECRET: super_secure_ci_test_service_secret_32bytes_long!
          JWT_SECRET: super_secure_ci_test_service_secret_32bytes_long!

      - name: Run Python Pipeline Integration Tests
        run: python python-backend/test_pipeline.py

      - name: Run Real AI Evaluation Suite
        run: python python-backend/test_evals.py

      - name: Run Database Tests
        run: python python-backend/test_db.py

      - name: Run Massive Multi-Tenancy Tests
        run: python python-backend/test_massive_multitenancy.py
