name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-secrets:
    name: Secret Scanning & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run NPM Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run pip-audit on Backend Requirements
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r python-backend/requirements.txt

  frontend-quality:
    name: Node.js Lint, Typecheck & Next.js Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Next.js Production Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          SESSION_JWT_SECRET: super_secure_ci_test_session_secret_32bytes_long!
          SERVICE_JWT_SECRET: super_secure_ci_test_service_secret_32bytes_long!
          ENCRYPTION_KEY: super_secure_ci_test_encryption_key_32bytes_long!

  python-backend-quality:
    name: Python Lint, Typecheck & Pytest Suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shopmate_user
          POSTGRES_PASSWORD: shopmate_password
          POSTGRES_DB: shopmate_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'python-backend/requirements-dev.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-backend/requirements-dev.txt

      - name: Verify Clean Production Import
        working-directory: python-backend
        run: python -c "import app.main; print('app.main imported cleanly without missing dependencies')"

      - name: Ruff Linting
        working-directory: python-backend
        run: ruff check app

      - name: Mypy Static Type Checking
        working-directory: python-backend
        run: mypy --config-file mypy.ini -p app.auth -p app.catalog -p app.billing

      - name: Run OpenAPI Smoke Test
        working-directory: python-backend
        run: pytest tests/test_smoke_openapi.py -v

      - name: Run Pytest Test Matrix (Auth, Catalog, Compliance, RAG Evals, Security, Billing, Teams)
        working-directory: python-backend
        run: pytest -v
        env:
          APP_ENV: development
          INTERNAL_SERVICE_SECRET: super_secure_ci_test_service_secret_32bytes_long!
          SERVICE_JWT_SECRET: super_secure_ci_test_service_secret_32bytes_long!
          JWT_SECRET: super_secure_ci_test_service_secret_32bytes_long!

  postgresql-rls-isolation:
    name: PostgreSQL Service Container RLS Enforcement Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: shopmate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'python-backend/requirements-dev.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-backend/requirements-dev.txt

      - name: Setup Non-Superuser Role & Run Alembic Migrations
        working-directory: python-backend
        env:
          PGPASSWORD: postgres_ci_password
        run: |
          export DATABASE_URL="postgresql+asyncpg://postgres:postgres_ci_password@localhost:5432/shopmate_ci"
          alembic upgrade head
          psql -h localhost -U postgres -d shopmate_ci -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'shopmate_app') THEN
                CREATE ROLE shopmate_app WITH LOGIN PASSWORD 'shopmate_app_ci_pass' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
              END IF;
            END
            \$\$;
            GRANT CONNECT ON DATABASE shopmate_ci TO shopmate_app;
            GRANT USAGE ON SCHEMA public TO shopmate_app;
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO shopmate_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO shopmate_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO shopmate_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO shopmate_app;
          "

      - name: Run RLS Isolation Tests as Non-Superuser
        working-directory: python-backend
        run: pytest tests/test_tenant_isolation.py -k "test_postgresql_rls_isolation_with_session_context" -v
        env:
          DATABASE_URL: "postgresql+asyncpg://shopmate_app:shopmate_app_ci_pass@localhost:5432/shopmate_ci"
          APP_ENV: production
          JWT_SECRET: super_secure_ci_test_service_secret_32bytes_long!
          SERVICE_JWT_SECRET: super_secure_ci_test_service_secret_32bytes_long!


